<!DOCTYPE html>
<html lang="ko">
<head>
    <title>링크태그</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="">
    <meta name="description" content="">
</head>
<body>
    <h1>링크태그</h1>
    <h2>절대경로</h2>
    <p>http://로 시작하는 실제 웹 서비스 주소</p>
    <a href="http://google.com" target="_blank">구글 바로가기</a>
    <a href="https://naver.com" target="_blank">네이버 바로가기</a>
    <a href="https://apple.com" target="_blank">애플 바로가기</a>
    <hr>
    <!-- 네이버 쇼핑탭 클론코딩 -->
    <div id="shopping_wrap">
        <!-- 1. 쇼핑 제목 탭 -->
        <div class="title_controls_wrap">
            <!-- 좌 -->
            <div class="title">
                <a href="#">쇼핑</a>
                <img src="" alt="">
                <a href="#">맨즈</a>
                <img src="" alt="">
                <a href="#">브랜드샵</a>
                <img src="" alt="">
                <a href="#" class="active">MY추천</a>
                <img src="" alt="">
                <a href="#">추천핫딜</a>
                <img src="" alt="">
                <a href="#">쇼핑라이브</a>
            </div><!-- e:title -->
            <!-- 우 -->
            <div class="controls">
                <em class="current_page">1</em>
                <span class="total_page">/12</span>
                <a href="#" class="prev_btn"><img src="" alt="이전상품보기"></a>
                <a href="#" class="next_btn"><img src="" alt="다음상품보기"></a>
            </div><!-- e:controls -->
        </div><!-- e:title_controls_wrap -->
        <!-- 2. 쇼핑 내용(광고, 주문, 추천태그, 상품목록) -->
        <div class="container">
            <div class="sidebar">
                <div class="ad">
                    <a href="#" target="_blank"><em>쿠팡</em></a>
                    <a href="#" target="_blank">G마켓</a>
                    <a href="#" target="_blank"><em>옥션</em></a>
                    <a href="#" target="_blank">11번가</a>
                    <a href="#" target="_blank">올리브영</a>
                    <a href="#" target="_blank">SSG닷컴</a>
                    <a href="#" target="_blank">하프클럽</a>
                    <a href="#" target="_blank">이마트몰</a>
                    <a href="#" target="_blank">SG SHOP</a>
                    <a href="#" target="_blank">패션 플러스</a>
                </div><!-- e:ad -->
                <div class="user_order_cart">
                    <a href="#" class="order">주문<img src="" alt="0"></a>
                    <img src="" alt="">
                    <a href="#" class="cart">장바구니<img src="" alt="0"></a>
                </div><!-- e:user_order_cart -->
                <div class="recommend_list">
                    <a href="#" class="active">#화장품/미용<img src="" alt=""></a>
                    <a href="#">#패션의류</a>
                    <a href="#">#가구/인테리어</a>
                    <a href="#">#식품</a>
                    <a href="#">#스포츠/레져</a>
                    <a href="#">#패션잡화</a>
                </div><!-- e:recommend_list -->
            </div><!-- e:sidebar -->
            <div class="right_contents">
                <a href="#" class="product">
                    <p class="photo"><img src="" alt=""></p>
                    <p class="msg"><em>불만족 시 반품가능</em></p>
                    <h2>자누아 편안한 경추베개</h2>
                    <div class="review_score_wrap">
                        <p class="score"><img src="" alt="별점">4.79</p>
                        <p class="review">리뷰 225</p>
                    </div>
                </a><!-- *8 -->
            </div><!-- e:right_contents -->
        </div><!-- e:container -->
        <!-- 3. 내용 더보기 -->
        <div class="more_wrap">
            <div class="center">
                <a href="#" class="prev_btn"><img src="" alt="이전페이지 보기"></a>
                <div class="more_page">
                    <em>MY추천</em><span>더보기</span>
                    <em class="current_page">1</em>
                    <span class="total_page">/12</span>
                </div><!-- e:more_page -->
                <a href="#" class="next_btn"><img src="" alt="다음페이지 보기"></a>
            </div><!-- e:center -->
            <a href="#" class="ad_but">AD</a>
        </div><!-- e:more_wrap -->
    </div><!-- e:shopping_wrap -->
</body>
</html>
